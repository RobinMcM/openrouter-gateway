# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name usageflows.info www.usageflows.info api.usageflows.info;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main API
server {
    listen 443 ssl;
    http2 on;
    server_name usageflows.info www.usageflows.info api.usageflows.info;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/usageflows.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usageflows.info/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Frame-Options removed to allow iframe embedding
    add_header X-Content-Type-Options "nosniff" always;
    
    # CORS Headers removed - handled by FastAPI CORSMiddleware to avoid duplicates
    
    # Proxy to OpenRouter Gateway
    location / {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
